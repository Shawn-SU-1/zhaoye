name: 出问题了
description: 渲染失败、闪退、导出异常、片边不对
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。这个 App 的效果取决于 GPU 和驱动，同一版 APK 在不同机器上
        差别可能很大，所以**请一定附上诊断报告**——没有它基本没法定位。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 现象是什么。如果是错误提示，请把提示原文照抄。
      placeholder: 点「冲印」两秒后，状态行显示「渲染失败：overscan」
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      description: 尽量具体，包括选的哪套胶片、哪张相纸、片边开没开。
      placeholder: |
        1. 打开一张 42MP 的 ARW
        2. 胶片选 Kodak Portra 400，片边「自动 · 135」
        3. 导出长边选 6400，点冲印
    validations:
      required: true

  - type: textarea
    id: diag
    attributes:
      label: 诊断报告
      description: |
        设置页 →「导出日志文件」，会生成一个 `zhaoye-YYYYMMDD-HHmmss.txt`。
        把**这个文件本身**拖进下面这个输入框（不是复制内容，拖文件）。
        报告里已经包含机型、系统版本、GPU capabilities、应用日志和 logcat。
      placeholder: 把 zhaoye-xxxxxxxx-xxxxxx.txt 拖到这里
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 机型与系统
      description: 报告里也有，这里方便快速扫一眼。
      placeholder: MIX FOLD / Adreno 660 / Android 11
    validations:
      required: true

  - type: textarea
    id: photo
    attributes:
      label: 用的什么照片
      description: RAW 还是 JPEG、大概多少像素。大图容易撞到 GPU 的显存上限。
      placeholder: Sony A7R IV 的 ARW，9504×6336，约 60MP

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我检查过报告，里面没有我不想公开的照片文件名或路径（logcat 会记打开过哪个文件）
          required: true
        - label: 我试过重启 App 和换一张照片，问题仍然存在
          required: true
